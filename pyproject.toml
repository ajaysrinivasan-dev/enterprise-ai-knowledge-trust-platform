[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eaktp"
version = "0.1.0"
description = "Enterprise AI Knowledge & Trust Platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
  "streamlit>=1.40,<2",
  "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "httpx>=0.27,<1",
]
documents = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
]
privacy = [
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
]
rag = [
  "sentence-transformers>=3.3,<6",
  "chromadb>=0.5,<1",
]
agents = [
  "langgraph>=0.2,<1",
]
evaluation = [
  "ragas>=0.2,<1",
  "deepeval>=1,<2",
]
training = [
  "transformers>=4.47,<5",
  "peft>=0.14,<1",
  "trl>=0.13,<1",
  "datasets>=3,<4",
  "bitsandbytes>=0.45,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
